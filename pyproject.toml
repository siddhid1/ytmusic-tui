[project]
name = "yt-tui-player"
version = "0.1.0"
description = "Terminal UI for streaming YouTube Music"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.0",
    "ytmusicapi>=1.12",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
yt-tui = "ytm_tui.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
